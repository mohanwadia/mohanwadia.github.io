<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Melbourne Bus Routes — mohanwadia.com</title>
    <meta name="description"
        content="Every metropolitan Melbourne bus route, drawn from PTV GTFS schedule data. Click a route to see its path and timetable details.">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --ink: #171B24;
            --ink-elevated: #1F2432;
            --ink-elevated-2: #262C3D;
            --hairline: #323A4D;
            --text: #EDEFF3;
            --text-muted: #8B93A6;
            --accent: #FFB020;
            --accent-dim: rgba(255, 176, 32, 0.14);
            --line-dim-opacity: 0.16;
            --panel-w: 376px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text);
            background: #dfe3e8;
            overflow: hidden;
        }

        #map {
            position: absolute;
            inset: 0;
            background: #dfe3e8;
        }

        /* ---------- Panel ---------- */
        #panel {
            position: absolute;
            top: 16px;
            right: 16px;
            bottom: auto;
            width: 320px;
            max-width: calc(100vw - 32px);
            max-height: calc(100vh - 32px);
            background: var(--ink);
            border: 1px solid var(--hairline);
            border-radius: 14px;
            box-shadow: 0 20px 50px -18px rgba(10, 12, 18, 0.55), 0 2px 8px rgba(10, 12, 18, 0.35);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }

        .panel-head {
            display: none;
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--hairline);
            flex-shrink: 0;
        }

        .eyebrow {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
            margin: 0 0 4px;
        }

        h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 26px;
            letter-spacing: 0.01em;
            margin: 0 0 4px;
            line-height: 1.05;
        }

        .sub {
            font-size: 12.5px;
            color: var(--text-muted);
            margin: 0;
        }

        .sub span {
            color: var(--text);
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 500;
        }

        /* Search */
        .search-wrap {
            display: none;
            padding: 12px 20px;
            border-bottom: 1px solid var(--hairline);
            flex-shrink: 0;
        }

        #list {
            display: none;
        }

        .credit {
            display: none;
        }

        #search {
            width: 100%;
            background: var(--ink-elevated);
            border: 1px solid var(--hairline);
            border-radius: 9px;
            padding: 9px 12px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color .15s ease;
        }

        #search:focus {
            border-color: var(--accent);
        }

        #search::placeholder {
            color: var(--text-muted);
        }

        /* List */
        #list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 10px 14px;
        }

        #list::-webkit-scrollbar {
            width: 8px;
        }

        #list::-webkit-scrollbar-thumb {
            background: var(--hairline);
            border-radius: 8px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 8px 10px;
            border-radius: 9px;
            cursor: pointer;
            transition: background .12s ease;
        }

        .row:hover {
            background: var(--ink-elevated);
        }

        .row.active {
            background: var(--accent-dim);
        }

        .badge {
            flex-shrink: 0;
            min-width: 44px;
            height: 26px;
            padding: 0 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.01em;
        }

        .row-name {
            font-size: 13px;
            color: var(--text);
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 40px 20px;
        }

        /* Detail view */
        #detail {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 18px 20px 20px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            padding: 0 0 16px;
        }

        .back-btn:hover {
            color: var(--accent);
        }

        .detail-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 56px;
            height: 34px;
            padding: 0 12px;
            border-radius: 7px;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .detail-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 600;
            font-size: 19px;
            line-height: 1.25;
            margin: 0 0 16px;
            color: var(--text);
        }

        .stat {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 10px 0;
            border-top: 1px solid var(--hairline);
        }

        .stat:last-of-type {
            border-bottom: 1px solid var(--hairline);
            margin-bottom: 16px;
        }

        .stat-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 11.5px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .stat-value {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--text);
            text-align: right;
            max-width: 60%;
        }

        .direction {
            padding: 12px 14px;
            background: var(--ink-elevated);
            border-radius: 9px;
            margin-bottom: 8px;
        }

        .direction-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            margin: 0 0 3px;
        }

        .direction-value {
            font-size: 13.5px;
            color: var(--text);
        }

        /* Footer credit */
        .credit {
            flex-shrink: 0;
            padding: 10px 20px 12px;
            border-top: 1px solid var(--hairline);
            font-size: 10.5px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .credit a {
            color: var(--text-muted);
        }

        /* Leaflet overrides */
        .leaflet-control-attribution {
            font-size: 10px !important;
            background: rgba(255, 255, 255, 0.75) !important;
        }

        .leaflet-popup-content-wrapper {
            background: var(--ink);
            color: var(--text);
            border-radius: 10px;
        }

        .leaflet-popup-content {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            margin: 10px 12px;
        }

        .leaflet-popup-tip {
            background: var(--ink);
        }

        .popup-num {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 16px;
            margin-right: 6px;
        }

        /* ---------- Frequency control ---------- */
        #freq-control {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 238px;
            background: var(--ink);
            border: 1px solid var(--hairline);
            border-radius: 14px;
            box-shadow: 0 20px 50px -18px rgba(10, 12, 18, 0.55), 0 2px 8px rgba(10, 12, 18, 0.35);
            padding: 14px 16px 16px;
            z-index: 1000;
        }

        .freq-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
            margin: 0 0 8px;
        }

        #freq-select {
            width: 100%;
            background: var(--ink-elevated);
            border: 1px solid var(--hairline);
            border-radius: 8px;
            padding: 8px 10px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        #freq-select:focus {
            border-color: var(--accent);
        }

        .freq-legend {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--hairline);
        }

        .freq-legend-row {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 3px 0;
        }

        .freq-swatch {
            flex-shrink: 0;
            width: 26px;
            height: 0;
            border-top-style: solid;
            border-radius: 2px;
        }

        .freq-swatch.dashed {
            border-top-style: dashed;
        }

        .freq-legend-text {
            font-size: 11.5px;
            color: var(--text-muted);
        }

        /* ---------- SA2 background data control ---------- */
        #sa2-control {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--hairline);
        }

        #sa2-select {
            width: 100%;
            background: var(--ink-elevated);
            border: 1px solid var(--hairline);
            border-radius: 8px;
            padding: 8px 10px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        #sa2-select:focus {
            border-color: var(--accent);
        }

        .sa2-hover-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            cursor: pointer;
            user-select: none;
        }

        .sa2-hover-toggle input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            background: var(--ink-elevated);
            border: 1px solid var(--hairline);
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background .12s ease, border-color .12s ease;
        }

        .sa2-hover-toggle input[type="checkbox"]:checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        .sa2-hover-toggle input[type="checkbox"]:checked::after {
            content: "";
            width: 4px;
            height: 8px;
            border: solid var(--ink);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg) translate(-1px, -1px);
        }

        .sa2-hover-toggle span {
            font-size: 12.5px;
            color: var(--text);
        }

        .sa2-legend {
            margin-top: 10px;
            display: none;
        }

        .sa2-legend.visible {
            display: block;
        }

        .sa2-gradient-bar {
            height: 10px;
            border-radius: 4px;
            border: 1px solid var(--hairline);
        }

        .sa2-legend-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'IBM Plex Mono', monospace;
        }

        .sa2-legend-caption {
            margin-top: 6px;
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* SA2 hover tooltip */
        .sa2-tooltip {
            background: var(--ink) !important;
            border: 1px solid var(--hairline) !important;
            color: var(--text) !important;
            border-radius: 8px !important;
            padding: 8px 10px !important;
            font-family: 'Inter', sans-serif !important;
            box-shadow: 0 12px 30px -10px rgba(10, 12, 18, 0.6) !important;
        }

        .sa2-tooltip::before {
            display: none !important;
        }

        .sa2-tooltip .tt-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 600;
            font-size: 13px;
            color: var(--accent);
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .sa2-tooltip .tt-badge {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 30px;
            height: 20px;
            padding: 0 6px;
            border-radius: 5px;
            font-size: 12.5px;
            font-weight: 700;
        }

        .sa2-tooltip .tt-value {
            font-size: 12.5px;
            color: var(--text);
        }

        /* Detail: frequency + span blocks */
        .block-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            margin: 18px 0 8px;
        }

        .freq-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 10px;
            border-radius: 7px;
            font-size: 13px;
        }

        .freq-row.current {
            background: var(--accent-dim);
        }

        .freq-row-period {
            color: var(--text);
        }

        .freq-row-value {
            font-family: 'IBM Plex Mono', monospace;
            color: var(--text-muted);
            font-size: 12.5px;
        }

        .freq-row.current .freq-row-value {
            color: var(--accent);
        }

        .span-row {
            padding: 10px 12px;
            background: var(--ink-elevated);
            border-radius: 9px;
            margin-bottom: 8px;
        }

        .span-row-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 0 0 3px;
        }

        .span-row-value {
            font-size: 13.5px;
            color: var(--text);
            font-family: 'IBM Plex Mono', monospace;
        }

        /* Mobile */
        @media (max-width: 680px) {
            :root {
                --panel-w: 100%;
            }

            #panel {
                top: auto;
                right: 12px;
                left: 12px;
                bottom: 12px;
                width: auto;
                max-height: 46vh;
            }

            h1 {
                font-size: 22px;
            }

            #freq-control {
                top: auto;
                right: 12px;
                left: 12px;
                width: auto;
                bottom: 12px;
            }
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <div id="sa2-hover-tooltip" class="sa2-tooltip" style="position:fixed; display:none; z-index:2000; pointer-events:none; max-width:220px;"></div>
    <div id="route-hover-tooltip" class="sa2-tooltip" style="position:fixed; display:none; z-index:2000; pointer-events:none; max-width:240px;"></div>

    <div id="panel">
        <div class="panel-head">
            <p class="eyebrow">Melbourne Transit</p>
            <h1>Bus Routes</h1>
            <p class="sub"><span id="route-count">–</span> routes · PTV GTFS schedule data</p>
        </div>

        <div class="search-wrap">
            <input id="search" type="text" placeholder="Search by number or destination…" autocomplete="off">
        </div>

        <div id="list"></div>

        <div id="detail"></div>

        <div class="credit">
            Route paths from <a
                href="https://discover.data.vic.gov.au/dataset/timetable-and-geographic-information-gtfs"
                target="_blank" rel="noopener">PTV GTFS timetable data</a>, Dept. of Transport &amp; Planning Victoria.
            Basemap © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>, © <a
                href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
            contributors.
        </div>
    </div>

    <div id="freq-control">
        <p class="freq-label">Lines shows frequency at</p>
        <select id="freq-select">
            <option value="weekday_am_peak">Weekday AM Peak</option>
            <option value="weekday_midday" selected>Weekday Midday</option>
            <option value="weekday_offpeak">Weekday Evening</option>
            <option value="saturday_midday">Saturday Midday</option>
            <option value="sunday_midday">Sunday Midday</option>
        </select>
        <div class="freq-legend" id="freq-legend"></div>

        <div id="sa2-control">
            <p class="freq-label">Area shading shows</p>
            <select id="sa2-select">
                <option value="">Off (basemap only)</option>
                <option value="bus400" selected>Any bus service within 400m</option>
                <option value="bus800hq">High-quality bus service within 800m</option>
                <option value="pt400">Any public transport within 400m</option>
                <option value="pt800hq">High-quality public transport within 800m</option>
                <option value="seifa_score">SEIFA score (socio-economic)</option>
                <option value="seifa_decile">SEIFA decile (1=disadv., 10=advantaged)</option>
                <option value="population">Population (2025 est.)</option>
                <option value="dwellings">Dwellings (2025 est.)</option>
            </select>
            <label class="sa2-hover-toggle">
                <input type="checkbox" id="sa2-hover-toggle-input" checked>
                <span>Show hover details</span>
            </label>
            <div class="sa2-legend" id="sa2-legend">
                <div class="sa2-gradient-bar" id="sa2-gradient-bar"></div>
                <div class="sa2-legend-labels">
                    <span id="sa2-legend-min">–</span>
                    <span id="sa2-legend-max">–</span>
                </div>
                <div class="sa2-legend-caption" id="sa2-legend-caption"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        (function () {

            var map = L.map('map', {
                zoomControl: false,
                attributionControl: true,
                preferCanvas: true
            }).setView([-37.8136, 144.9631], 11);

            L.control.zoom({ position: 'topright' }).addTo(map);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', {
                attribution: '',
                maxZoom: 19,
                subdomains: 'abcd'
            }).addTo(map);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_labels_under/{z}/{x}/{y}{r}.png', {
                attribution: '',
                maxZoom: 19,
                subdomains: 'abcd',
                pane: 'shadowPane'
            });

            var canvasRenderer = L.canvas({ padding: 0.5 });
            map.createPane('densityPane');
            map.getPane('densityPane').style.zIndex = 300;

            // SA2 choropleth sits above the basemap but below the route lines/halos,
            // so it reads as a background layer.
            map.createPane('sa2Pane');
            map.getPane('sa2Pane').style.zIndex = 250;
            var sa2Renderer = L.canvas({ pane: 'sa2Pane', padding: 0.3 });

            // ---- Frequency data ----
            var FREQ_URL = 'https://cdn.jsdelivr.net/gh/adambain014/FrequencyFinder@main/route_jsons/summary.json';
            var freqById = {};       // route_number -> summary object
            var currentPeriod = 'weekday_midday';

            var PERIODS = {
                weekday_am_peak: { label: 'Weekday AM Peak' },
                weekday_midday: { label: 'Weekday Midday' },
                weekday_offpeak: { label: 'Weekday Offpeak' },
                saturday_midday: { label: 'Saturday Midday' },
                sunday_midday: { label: 'Sunday Midday' }
            };

            // Bucketed line-weight scale: lower average wait (more frequent) = thicker line.
            var FREQ_BUCKETS = [
                { key: 'dark-red', max: 10, weight: 7.5, opacity: 0.92, color: '#5a0b0b', label: '10 min or less' },
                { key: 'red', max: 15, weight: 6, opacity: 0.9, color: '#b22323', label: '15 minutes' },
                { key: 'purple', max: 20, weight: 4.6, opacity: 0.88, color: '#6e3ea8', label: '20 minutes' },
                { key: 'blue', max: 30, weight: 3.2, opacity: 0.85, color: '#0f84a8', label: '30 minutes' },
                { key: 'teal', max: 60, weight: 2.1, opacity: 0.8, color: '#4ca3a3', label: '40-60 minutes' },
                { key: 'brown', max: Infinity, weight: 1.3, opacity: 0.62, color: '#95783b', label: 'Peak Only / Limited Service' }
            ];
            var bucketVisibility = {};
            FREQ_BUCKETS.forEach(function (bucket) { bucketVisibility[bucket.key] = true; });

            function freqBucket(min) {
                for (var i = 0; i < FREQ_BUCKETS.length; i++) { if (min === null || min === undefined || isNaN(min) ? FREQ_BUCKETS[i].key === 'brown' : min <= FREQ_BUCKETS[i].max) return FREQ_BUCKETS[i]; }
                return FREQ_BUCKETS[FREQ_BUCKETS.length - 1];
            }

            // Extracts the minutes-average-wait value for a given period from a route's summary entry.
            function periodValue(entry, period) {
                if (!entry) return null;
                var freqSummary = entry.frequency_summary || [];
                var byDay = {};
                freqSummary.forEach(function (row) { byDay[row.day] = row; });
                var peak = (entry.peak_medians && entry.peak_medians[0]) || {};

                switch (period) {
                    case 'weekday_am_peak':
                        return numOrNull(peak['Median AM Peak Wait']);
                    case 'weekday_midday':
                        return byDay.Monday ? numOrNull(byDay.Monday.daytime) : null;
                    case 'weekday_offpeak':
                        return byDay.Monday ? numOrNull(byDay.Monday.evening) : null;
                    case 'saturday_midday':
                        return byDay.Saturday ? numOrNull(byDay.Saturday.daytime) : null;
                    case 'sunday_midday':
                        return byDay.Sunday ? numOrNull(byDay.Sunday.daytime) : null;
                    default:
                        return null;
                }
            }

            function numOrNull(v) {
                return (typeof v === 'number' && !isNaN(v)) ? v : null;
            }

            function freqStyleForRoute(props) {
                var entry = freqById[props.short_name];
                var val = periodValue(entry, currentPeriod);
                var bucket = freqBucket(val);
                var style = { weight: bucket.weight, opacity: bucket.opacity, color: bucket.color || props.color || '#333' };
                if (bucket.dash) { style.dashArray = bucket.dash; } else { style.dashArray = null; }
                return style;
            }

            function isRouteBucketVisible(props) {

            function escapeHtmlGlobal(s) {

            // Converts GTFS-style minutes-since-midnight (can exceed 1440) into a 12-hour clock string.
            function minutesToClock(mins) {
                if (mins === null || mins === undefined || isNaN(mins)) return '—';
                var wrapped = ((mins % 1440) + 1440) % 1440;
                var nextDay = mins >= 1440;
                var h = Math.floor(wrapped / 60);
                var m = Math.round(wrapped % 60);
                var period = h >= 12 ? 'PM' : 'AM';
                var h12 = h % 12; if (h12 === 0) h12 = 12;
                var mm = (m < 10 ? '0' : '') + m;
                return h12 + ':' + mm + ' ' + period + (nextDay ? ' (+1)' : '');

            function dimAllExcept(id) {
                Object.keys(layersById).forEach(function (k) {
                    var layer = layersById[k];

            function renderList(filterText) {
                listEl.innerHTML = '';
                var q = (filterText || '').trim().toLowerCase();
                var order = Object.keys(routesById).sort(function (a, b) {
                    var pa = routesById[a].properties, pb = routesById[b].properties;
                    var na = leadingNumber(pa.short_name), nb = leadingNumber(pb.short_name);
                    if (na !== nb) return na - nb;
                    return pa.short_name.localeCompare(pb.short_name);
                });

                var shown = 0;
                var matchedIds = [];
                order.forEach(function (id) {
                    var props = routesById[id].properties;
                    if (!isRouteBucketVisible(props)) return;
                    var hay = (props.short_name + ' ' + props.long_name).toLowerCase();
                    var match = !q || hay.indexOf(q) !== -1;

                // dim/undim map lines to match filter
                window.__filterActive = !!q;
                order.forEach(function (id) {

                    var fs = freqStyleForRoute(routesById[id].properties);
                    if (!q) {

            // ---- SA2 background choropleth ----

            var hoveredSa2Code = null;

            var SA2_COLOR_STOPS = {

                seifa: ['#eef4fb', '#b7d3ea', '#6fa8d6', '#3573b0', '#0d3f70'],   // light -> dark blue
                count: ['#2a2110', '#6b4a1a', '#a86d1f', '#d69331', '#FFB020']    // dark -> accent amber
            };

            function hexToRgb(hex) {
                var n = parseInt(hex.slice(1), 16);
                return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
            }

            function rgbToHex(rgb) {
                return '#' + rgb.map(function (v) {
                    return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
                }).join('');
            }

            function interpolatePalette(stops, t) {
                t = Math.max(0, Math.min(1, t));
                var n = stops.length - 1;
                var seg = Math.min(n - 1, Math.floor(t * n));
                var localT = (t * n) - seg;
                var c0 = hexToRgb(stops[seg]);
                var c1 = hexToRgb(stops[seg + 1]);
                var rgb = c0.map(function (v, i) { return v + (c1[i] - v) * localT; });
                return rgbToHex(rgb);
            }

            function sa2ColorForValue(metricKey, value) {
                var m = SA2_METRICS[metricKey];
                if (value === null || value === undefined || isNaN(value)) return '#3a4155';
                var t = (value - m.domain[0]) / (m.domain[1] - m.domain[0]);
                return interpolatePalette(SA2_COLOR_STOPS[m.palette], t);
            }

            function sa2FormatValue(format, value) {
                if (value === null || value === undefined || isNaN(value)) return 'No data';
                switch (format) {
                    case 'percent': return Math.round(value * 100) + '%';
                    case 'count': return Math.round(value).toLocaleString();
                    case 'decile': return 'Decile ' + Math.round(value);
                    case 'score': return Math.round(value).toLocaleString();
                    default: return String(value);
                }
            }

            function sa2StyleFor(metricKey) {
                return function (feature) {
                    if (!metricKey) return { renderer: sa2Renderer, pane: 'sa2Pane', stroke: false, opacity: 0, fillOpacity: 0 };
                    var m = SA2_METRICS[metricKey];
                    var val = feature.properties[m.prop];
                    return {
                        renderer: sa2Renderer,
                        pane: 'sa2Pane',
                        stroke: true,
                        color: 'rgba(23, 27, 36, 0.35)',
                        weight: 0.6,
                        fillColor: sa2ColorForValue(metricKey, val),
                        fillOpacity: 0.62
                    };
                };

            function sa2BaseStyleObj(feature) {

            function sa2HoverStyleObj(feature) {
                var base = sa2BaseStyleObj(feature);
                return Object.assign({}, base, {
                    stroke: true,

                    color: 'rgba(255, 176, 32, 0.8)',

            function sa2ActiveStyleObj(feature) {
                var base = sa2BaseStyleObj(feature);
                return Object.assign({}, base, {
                    stroke: true,
                    weight: 2.6,
                    color: '#FFB020',
                    fillOpacity: Math.min((base.fillOpacity || 0) + 0.26, 0.94)
                });
            }

            function sa2StyleForCode(code) {
                if (code === activeSa2Code) return sa2ActiveStyleObj;
                return sa2BaseStyleObj;
            }

            // ---- Manual hit-testing ----
            // The route lines and their density-halo layer sit in panes above sa2Pane, and
            // their canvas elements cover the whole map regardless of what's drawn, so real
            // Leaflet layer click/mouseover events on the SA2 polygons never fire. We hit-test
            // by hand against the map's own click/mousemove events instead.
            function pointInRing(x, y, ring) {
                var inside = false;
                for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                    var xi = ring[i][0], yi = ring[i][1];
                    var xj = ring[j][0], yj = ring[j][1];
                    var intersect = ((yi > y) !== (yj > y)) &&
                        (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                    if (intersect) inside = !inside;
                }
                return inside;
            }

            function pointInPolygonRings(x, y, rings) {
                if (!pointInRing(x, y, rings[0])) return false;
                for (var i = 1; i < rings.length; i++) {
                    if (pointInRing(x, y, rings[i])) return false; // inside a hole
                }
                return true;
            }

            function pointInFeature(latlng, feature) {
                var x = latlng.lng, y = latlng.lat;
                var geom = feature.geometry;
                if (geom.type === 'Polygon') {
                    return pointInPolygonRings(x, y, geom.coordinates);
                } else if (geom.type === 'MultiPolygon') {
                    for (var i = 0; i < geom.coordinates.length; i++) {
                        if (pointInPolygonRings(x, y, geom.coordinates[i])) return true;
                    }
                }
                return false;
            }

            function findSa2AtLatLng(latlng) {
                for (var i = 0; i < sa2FeatureList.length; i++) {
                    var entry = sa2FeatureList[i];
                    if (!entry.bounds.contains(latlng)) continue;
                    if (pointInFeature(latlng, entry.feature)) return entry.code;
                }
                return null;
            }

                    updateUrl(null);
                }
                if (activeSa2Code && activeSa2Code !== code && sa2LayersByCode[activeSa2Code]) {
                    sa2LayersByCode[activeSa2Code].setStyle(sa2BaseStyleObj(sa2LayersByCode[activeSa2Code].feature));
                }
                activeSa2Code = code;
                var layer = sa2LayersByCode[code];
                if (layer) {
                    layer.setStyle(sa2ActiveStyleObj(layer.feature));
                    layer.bringToFront();
                }
                document.getElementById('panel').style.display = 'flex';
                renderSa2Detail(code);
                updateSa2Url(code);
            }

            function clearSa2Selection() {
                if (activeSa2Code && sa2LayersByCode[activeSa2Code]) {
                    sa2LayersByCode[activeSa2Code].setStyle(sa2BaseStyleObj(sa2LayersByCode[activeSa2Code].feature));
                }
                if (hoveredSa2Code && hoveredSa2Code !== activeSa2Code && sa2LayersByCode[hoveredSa2Code]) {
                    sa2LayersByCode[hoveredSa2Code].setStyle(sa2BaseStyleObj(sa2LayersByCode[hoveredSa2Code].feature));
                }
                activeSa2Code = null;
                document.getElementById('panel').style.display = 'none';
                detailEl.style.display = 'none';
                detailEl.innerHTML = '';
                updateSa2Url(null);
            }

            function showSa2Tooltip(code, clientX, clientY) {
                if (!hoverEffectsEnabled) return;
                if (!currentSa2Metric) return; // never show a bare "name only" tooltip — only when a statistic is selected
                var layer = sa2LayersByCode[code];
                if (!layer) return;
                var el = document.getElementById('sa2-hover-tooltip');
                el.innerHTML = sa2TooltipHtml(currentSa2Metric, layer.feature.properties);
                el.style.display = 'block';
                positionTooltipEl(el, clientX, clientY);
            }

            function positionTooltipEl(el, clientX, clientY) {
                var flipX = clientX > window.innerWidth - 240;
                var flipY = clientY < 100;
                el.style.left = flipX ? '' : (clientX + 16) + 'px';
                el.style.right = flipX ? (window.innerWidth - clientX + 16) + 'px' : '';
                el.style.top = flipY ? (clientY + 16) + 'px' : (clientY - 16) + 'px';
                el.style.transform = flipY ? 'translateY(0)' : 'translateY(-100%)';
            }

            function positionSa2Tooltip(clientX, clientY) {
                positionTooltipEl(document.getElementById('sa2-hover-tooltip'), clientX, clientY);
            }

            function hideSa2Tooltip() {
                document.getElementById('sa2-hover-tooltip').style.display = 'none';
            }

            function showRouteTooltip(id, clientX, clientY) {
                if (!hoverEffectsEnabled) return;
                var el = document.getElementById('route-hover-tooltip');
                el.innerHTML = routeTooltipHtml(id);
                el.style.display = 'block';
                positionTooltipEl(el, clientX, clientY);
            }

            function positionRouteTooltip(clientX, clientY) {
                positionTooltipEl(document.getElementById('route-hover-tooltip'), clientX, clientY);
            }

            function hideRouteTooltip() {
                document.getElementById('route-hover-tooltip').style.display = 'none';
            }

            function setupSa2Interaction() {
                var mapContainer = map.getContainer();
                var pendingEvent = null;
                var rafScheduled = false;

                function handleMove(latlng, clientX, clientY) {
                    if (!hoverEffectsEnabled) {
                        if (hoveredSa2Code && hoveredSa2Code !== activeSa2Code && sa2LayersByCode[hoveredSa2Code]) {
                            sa2LayersByCode[hoveredSa2Code].setStyle(sa2BaseStyleObj(sa2LayersByCode[hoveredSa2Code].feature));
                        }
                        hoveredSa2Code = null;
                        hideSa2Tooltip();
                        mapContainer.style.cursor = '';
                        return;
                    }

                    if (routeHoverId) {
                        // A route is being hovered — only the route should light up, so suppress SA2 hover feedback.
                        if (hoveredSa2Code && hoveredSa2Code !== activeSa2Code && sa2LayersByCode[hoveredSa2Code]) {
                            sa2LayersByCode[hoveredSa2Code].setStyle(sa2BaseStyleObj(sa2LayersByCode[hoveredSa2Code].feature));
                        }
                        hoveredSa2Code = null;
                        hideSa2Tooltip();
                        return;
                    }

                    var code = findSa2AtLatLng(latlng);

                    if (code === hoveredSa2Code) {
                        if (code) positionSa2Tooltip(clientX, clientY);
                        return;
                    }

                    if (hoveredSa2Code && hoveredSa2Code !== activeSa2Code && sa2LayersByCode[hoveredSa2Code]) {
                        sa2LayersByCode[hoveredSa2Code].setStyle(sa2BaseStyleObj(sa2LayersByCode[hoveredSa2Code].feature));
                    }

                    hoveredSa2Code = code;

                    if (code) {
                        if (code !== activeSa2Code && sa2LayersByCode[code]) {
                            sa2LayersByCode[code].setStyle(sa2HoverStyleObj(sa2LayersByCode[code].feature));
                            sa2LayersByCode[code].bringToFront();
                        }
                        showSa2Tooltip(code, clientX, clientY);
                        mapContainer.style.cursor = 'pointer';
                    } else {
                        hideSa2Tooltip();
                        mapContainer.style.cursor = '';
                    }
                }

                map.on('mousemove', function (e) {
                    pendingEvent = e;
                    if (rafScheduled) return;
                    rafScheduled = true;
                    requestAnimationFrame(function () {
                        rafScheduled = false;
                        if (!pendingEvent) return;
                        handleMove(pendingEvent.latlng, pendingEvent.originalEvent.clientX, pendingEvent.originalEvent.clientY);
                    });
                });

                map.on('mouseout', function () {
                    if (hoveredSa2Code && hoveredSa2Code !== activeSa2Code && sa2LayersByCode[hoveredSa2Code]) {
                        sa2LayersByCode[hoveredSa2Code].setStyle(sa2BaseStyleObj(sa2LayersByCode[hoveredSa2Code].feature));
                    }
                    hoveredSa2Code = null;
                    hideSa2Tooltip();
                    mapContainer.style.cursor = '';
                });

                map.on('click', function (e) {
                    var code = findSa2AtLatLng(e.latlng);
                    if (code) {
                        hideSa2Tooltip();
                        selectSa2(code);
                    } else {
                        if (activeSa2Code) clearSa2Selection();
                        if (activeId) clearSelection();
                    }
                });
            }

            document.getElementById('sa2-select').addEventListener('change', function () {
                updateSa2Display(this.value);
            });

            document.getElementById('sa2-hover-toggle-input').addEventListener('change', function () {
                hoverEffectsEnabled = this.checked;
                if (!hoverEffectsEnabled) {
                    hideSa2Tooltip();
                    hideRouteTooltip();
                    if (hoveredSa2Code && hoveredSa2Code !== activeSa2Code && sa2LayersByCode[hoveredSa2Code]) {
                        sa2LayersByCode[hoveredSa2Code].setStyle(sa2BaseStyleObj(sa2LayersByCode[hoveredSa2Code].feature));
                    }
                    hoveredSa2Code = null;
                    if (routeHoverId && layersById[routeHoverId] && routeHoverId !== activeId) {
                        unpreviewRoute(routeHoverId);
                    }
                    routeHoverId = null;
                    map.getContainer().style.cursor = '';
                }
            });

            var sa2Fetch = fetch(SA2_URL)
                .then(function (r) { if (!r.ok) throw new Error('sa2 http ' + r.status); return r.json(); })
                .then(function (fc) {
                    sa2Layer = L.geoJSON(fc, {
                        style: sa2StyleFor(currentSa2Metric),
                        interactive: false
                    }).addTo(map);

                    sa2Layer.eachLayer(function (layer) {
                        var code = layer.feature.properties.SA2_CODE21;
                        sa2LayersByCode[code] = layer;
                        sa2FeatureList.push({
                            code: code,
                            feature: layer.feature,
                            layer: layer,
                            bounds: layer.getBounds()
                        });
                    });

                    updateSa2Display(currentSa2Metric);
                    setupSa2Interaction();

                    // deep-link support: ?sa2=213011343
                    var sa2Params = new URLSearchParams(window.location.search);
                    var wantedSa2 = sa2Params.get('sa2');
                    if (wantedSa2 && sa2LayersByCode[wantedSa2]) {
                        selectSa2(wantedSa2);
                    }
                })
                .catch(function (err) {
                    console.warn('Could not load SA2 background data:', err.message);
                    document.getElementById('sa2-control').style.display = 'none';
                });

            var freqFetch = fetch(FREQ_URL)
                .then(function (r) { if (!r.ok) throw new Error('freq http ' + r.status); return r.json(); })
                .catch(function (err) {
                    console.warn('Could not load frequency data:', err.message);
                    return {};
                });

            var routesFetch = fetch('routes.geojson')
                .then(function (r) { return r.json(); });

            Promise.all([routesFetch, freqFetch])
                .then(function (results) {
                    var fc = results[0];
                    freqById = results[1] || {};

                    fc.features.forEach(function (f) {
                        routesById[f.properties.route_id] = f;
                    });

                    var geoLayer = L.geoJSON(fc, {
                        style: function (f) { return baseStyle(f.properties); },
                        onEachFeature: function (f, layer) {
                            densityLayersById[f.properties.route_id] = L.geoJSON(f, {
                                pane: 'densityPane',
                                style: densityStyle,
                                interactive: false
                            }).addTo(map);
                            layersById[f.properties.route_id] = layer;
                            layer.options.interactive = false;

                            // Invisible, much-wider line stacked on top of the visible route so the
                            // clickable/hoverable area is generous even for thin, low-frequency lines.
                            // Leaflet's canvas hit-testing uses the layer's own weight for tolerance
                            // regardless of its (zero) opacity, so this doesn't change how anything looks.
                            var hitLayer = L.geoJSON(f, {
                                style: function () {
                                    return {
                                        color: '#000',
                                        weight: 18,
                                        opacity: 0,
                                        lineCap: 'round',
                                        lineJoin: 'round',
                                        renderer: canvasRenderer
                                    };
                                }
                            }).addTo(map);
                            hitLayersById[f.properties.route_id] = hitLayer;
                            hitLayer.on('click', function (e) { L.DomEvent.stopPropagation(e); selectRoute(f.properties.route_id, true); });
                            hitLayer.on('mouseover', function (e) {
                                if (!hoverEffectsEnabled) return;
                                routeHoverId = f.properties.route_id;
                                previewRoute(f.properties.route_id);
                                showRouteTooltip(f.properties.route_id, e.originalEvent.clientX, e.originalEvent.clientY);
                                map.getContainer().style.cursor = 'pointer';
                            });
                            hitLayer.on('mousemove', function (e) {
                                if (!hoverEffectsEnabled || routeHoverId !== f.properties.route_id) return;
                                positionRouteTooltip(e.originalEvent.clientX, e.originalEvent.clientY);
                            });
                            hitLayer.on('mouseout', function () {
                                if (routeHoverId === f.properties.route_id) {
                                    routeHoverId = null;
                                    map.getContainer().style.cursor = '';
                                }
                                unpreviewRoute(f.properties.route_id);
                                hideRouteTooltip();
                            });
                        }
                    }).addTo(map);

                    fullBounds = geoLayer.getBounds();
                    updateRouteVisibility();
                    renderList('');

                    // deep-link support: ?route=57
                    var params = new URLSearchParams(window.location.search);
                    var wanted = params.get('route');
                    if (wanted) {
                        var match = Object.keys(routesById).find(function (id) {
                            return routesById[id].properties.short_name === wanted;
                        });
                        if (match) selectRoute(match, true);
                    }
                })
                .catch(function (err) {
                    listEl.innerHTML = '<div class="empty-state">Couldn’t load route data.<br>' + escapeHtml(err.message) + '</div>';
                    console.error(err);
                });

        })();
    </script>

</body>
