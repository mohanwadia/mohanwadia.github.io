<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buses from Monash Uni to...</title>
    <style>
        /* Base Metro-style Screen Foundation */
        body {
            background-color: #d8dee2; /* Station screen grey */
            color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 25px;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header Board */
        header {
            font-size: 2.8rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            padding-bottom: 15px;
        }

        /* Metro-style Top Horizontal Divider */
        .top-divider {
            border: 0;
            height: 3px;
            background-color: #5d6b73;
            margin: 0 0 25px 0;
        }

        /* Main Screen Split (Two columns left/right) */
        .pid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            flex-grow: 1;
        }

        .column {
            display: flex;
            flex-direction: column;
        }

        /* Destination Row Box */
        .destination-row {
            border-bottom: 2px solid #b0b8bc;
            padding: 15px 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 120px;
            box-sizing: border-box;
        }

        /* Left Side: Text Data */
        .destination-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .destination-name {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .sub-via {
            font-size: 1.3rem;
            color: #555;
            margin-top: 4px;
            font-weight: 500;
        }

        /* Right Side: Stacked Vertical Departures */
        .departures-stack {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            width: 210px; /* Forces uniform alignment width across different rows */
        }

        /* Complete Detached Row Wrapper */
        .bus-block {
            display: flex;
            gap: 6px; /* Explicit gap between the elements */
            width: 100%;
            padding: 6px 0;
        }

        /* Thin horizontal divider separating individual bus departures within the same stack */
        .bus-block:not(:last-child) {
            border-bottom: 1px solid #b0b8bc;
        }

        /* Individual Rectangle Base Properties (Strictly No Rounded Corners) */
        .rect {
            font-size: 1.4rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 42px;
            border-radius: 0px; /* No rounded corners */
            box-sizing: border-box;
        }

        /* Block 1: Route Identifier tag (Orange Background) */
        .route-rect {
            background-color: #ff9900; /* Distinct crisp orange */
            color: #1a1a1a;            /* High contrast dark text */
            width: 55px;
        }

        /* Block 2: Platform/Bay Badge */
        .bay-rect {
            background-color: #ffffff;
            color: #1a1a1a;
            border: 1px solid #b0b8bc;
            width: 45px;
        }

        /* Block 3: Countdown Element (Solid Black Background) */
        .time-rect {
            background-color: #1a1a1a; 
            color: #ffffff;            
            width: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Thin lined internal text container nested inside the time block */
        .time-border-inner {
            border: 1px solid #ffffff; /* Thin crisp interior border */
            width: calc(100% - 6px);
            height: calc(100% - 6px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .no-services {
            font-size: 1.6rem;
            color: #777;
            font-style: italic;
            padding-right: 20px;
        }

        /* Station Screen Digital Clock */
        footer {
            text-align: right;
            font-size: 2.4rem;
            font-weight: bold;
            padding-top: 20px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>Buses from Monash University to</header>
    <hr class="top-divider">

    <div class="pid-container">
        <div class="column" id="left-col"></div>

        <div class="column" id="right-col"></div>
    </div>

    <footer id="live-clock">0:00:00 pm</footer>

    <script>
        const WORKER_URL = 'https://ptv.mohanwadia.workers.dev';

        // Generates the structure for a destination and its departures
        function generateRowHtml(name, subVia, buses) {
            let departuresHtml = '';
            
            if (!buses || buses.length === 0) {
                departuresHtml = '<div class="no-services">No services filtering</div>';
            } else {
                departuresHtml = '<div class="departures-stack">';
            buses.forEach(bus => {
                departuresHtml += `
                    <div class="bus-block">
                        <div class="rect route-rect">${bus.route}</div>
                        <div class="rect bay-rect">${bus.bay}</div>
                        <div class="rect time-rect">${bus.mins}</div>
                    </div>
                `;
            });
                departuresHtml += '</div>';
            }

            return `
                <div class="destination-row">
                    <div class="destination-info">
                        <div class="destination-name">${name}</div>
                        ${subVia ? `<div class="sub-via">${subVia}</div>` : ''}
                    </div>
                    ${departuresHtml}
                </div>
            `;
        }

        async function updateBoard() {
            try {
                const response = await fetch(WORKER_URL);
                const data = await response.json();

                const leftCol = document.getElementById('left-col');
                const rightCol = document.getElementById('right-col');

                // Render Left Columns
                leftCol.innerHTML = 
                    generateRowHtml('Chadstone', 'Via Oakleigh', data.Chadstone) +
                    generateRowHtml('Huntingdale', null, data.Huntingdale) +
                    generateRowHtml('Clayton', null, data.Clayton);

                // Render Right Columns
                rightCol.innerHTML = 
                    generateRowHtml('Syndal', null, data.Syndal) +
                    generateRowHtml('Dandenong', null, data.Dandenong);

            } catch (error) {
                console.error("Error fetching data from worker:", error);
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString('en-AU', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            }).toLowerCase();
        }

        // Loop Triggers
        updateBoard();
        setInterval(updateBoard, 30000);

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
