<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melbourne Transport Stop PDF Generator</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f8f9fa;
            color: #333;
        }

        h2 {
            color: #004685;
            margin-bottom: 20px;
            border-bottom: 2px solid #004685;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
        }

        button {
            background: #004685;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover {
            background: #002d57;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            color: #555;
            font-style: italic;
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>Transit Stop PDF Generator</h2>

    <div class="form-group">
        <label for="lat">Latitude:</label>
        <input type="number" id="lat" value="-37.920303" step="any">
    </div>
    <div class="form-group">
        <label for="lon">Longitude:</label>
        <input type="number" id="lon" value="145.158681" step="any">
    </div>
    <button id="generateBtn">Generate Professional Report</button>

    <div id="status"></div>

    <script>

        function minutesTo12hr(totalMinutes) {
            totalMinutes = ((totalMinutes % 1440) + 1440) % 1440;
            const hours = Math.floor(totalMinutes / 60);
            const period = hours < 12 ? 'am' : 'pm';
            let hours12 = hours % 12;
            if (hours12 === 0) hours12 = 12;
            return `${hours12}${period}`;
        }

        function isNullish(value) {
            return value === null || value === undefined || value === 'null';
        }

        function roundFreq(value) {
            if (value >= 35) return 10 * Math.round(value / 10);
            if (value >= 15) return 5 * Math.round(value / 5);
            return Math.round(value);
        }

        function getFreqLabel(frequencyData, routeShortName) {
            const entry = frequencyData[String(routeShortName)];
            const freqData = entry && entry.frequency_summary;
            if (!freqData) return 'Not Found';

            const days = ['Mon', 'Sat', 'Sun'];
            let parts = [];
            for (let i = 0; i < 3; i++) {
                const dayData = freqData[i];

                if (isNullish(dayData.morning) && isNullish(dayData.daytime) && isNullish(dayData.evening)) {
                    parts.push(`${days[i]} N/A`);
                    continue;
                }

                const dataList = [dayData.morning, dayData.daytime].filter((t) => !isNullish(t));
                if (dataList.length === 0) {
                    parts.push(`${days[i]} N/A`);
                    continue;
                }

                let minFreq = Math.min(...dataList);
                let maxFreq = Math.max(...dataList);
                let avgFreq = (minFreq + maxFreq) / 2;

                minFreq = roundFreq(minFreq);
                maxFreq = roundFreq(maxFreq);
                avgFreq = roundFreq(avgFreq);

                let freqStr = '';
                if (maxFreq < 15) {
                    freqStr = (maxFreq - minFreq < 5) ? `${avgFreq.toFixed(0)}m` : `${minFreq.toFixed(0)}-${maxFreq.toFixed(0)}m`;
                } else if (maxFreq - minFreq < 5) {
                    freqStr = `${avgFreq.toFixed(0)}m`;
                } else if (minFreq < 35) {
                    freqStr = `${minFreq.toFixed(0)}-${maxFreq.toFixed(0)}m`;
                } else if (maxFreq - minFreq < 10) {
                    freqStr = `${avgFreq.toFixed(0)}m`;
                } else {
                    freqStr = `${minFreq.toFixed(0)}-${maxFreq.toFixed(0)}m`;
                }
                parts.push(`${days[i]} ${freqStr}`);
            }
            return parts.join(' | ');
        }

        function getSpanLabel(frequencyData, routeShortName) {
            const entry = frequencyData[String(routeShortName)];
            const spanData = entry && entry.span_stats;
            if (!spanData) return 'Not Found';

            const days = ['Mon', 'Sat', 'Sun'];
            const dayIndices = [0, 5, 6];
            let parts = [];
            
            for (let idx = 0; idx < 3; idx++) {
                const i = dayIndices[idx];
                const dayStats = spanData[i];
                if (!dayStats || isNullish(dayStats.span_start) || isNullish(dayStats.span_end)) {
                    parts.push(`${days[idx]} N/A`);
                    continue;
                }
                const firstServiceHour = Math.ceil(dayStats.span_start / 60);
                const lastServiceHour = Math.floor(dayStats.span_end / 60);
                parts.push(`${days[idx]} ${minutesTo12hr(firstServiceHour * 60)}-${minutesTo12hr(lastServiceHour * 60)}`);
            }
            return parts.join(' | ');
        }

        // Function to draw a small icon as simple shapes
        function drawLocationIcon(page, x, y) {
            page.drawCircle({ x, y, radius: 1.5, color: rgb(0.2, 0.2, 0.2) });
        }

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const lat = parseFloat(document.getElementById('lat').value);
            const lon = parseFloat(document.getElementById('lon').value);
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('generateBtn');

            btn.disabled = true;
            statusDiv.innerText = "Fetching transit data...";

            try {
                const radius = 800;
                const response = await fetch(`https://nearest-stops.mohanwadia.workers.dev/?lat=${lat}&lon=${lon}&radius=${radius}`);
                if (!response.ok) throw new Error('Worker API failed to reply.');
                const data = await response.json();

                statusDiv.innerText = "Fetching real frequency & span data...";

                let frequencyData = {};
                try {
                    const freqResponse = await fetch('https://raw.githubusercontent.com/adambain014/FrequencyFinder/main/route_jsons/summary.json');
                    if (freqResponse.ok) {
                        frequencyData = await freqResponse.json();
                    }
                } catch (freqError) {
                    console.warn('Could not load frequency data:', freqError);
                }

                statusDiv.innerText = "Constructing professional layout...";

                const { PDFDocument, StandardFonts, rgb } = PDFLib;
                const pdfDoc = await PDFDocument.create();

                const page = pdfDoc.addPage([595, 842]);
                const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
                const boldFont = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

                const ptvColor = (r, g, b) => rgb(r / 255, g / 255, b / 255);

                const routes = data.routes ?? [];

                // === HEADER SECTION ===
                // "Transport Near" + location title - CENTERED
                page.drawText("Transport Near", {
                    x: 297.5,
                    y: 842 - 20,
                    size: 18,
                    font: boldFont,
                    color: rgb(0, 0, 0),
                    align: 'center',
                    maxWidth: 595
                });

                const locationName = data.location_name || `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
                const postcode = data.postcode || '';
                let titleLine = locationName;
                if (postcode) titleLine += ` ${postcode}`;

                page.drawText(titleLine, {
                    x: 297.5,
                    y: 842 - 38,
                    size: 12,
                    font: boldFont,
                    color: rgb(0, 0, 0),
                    align: 'center',
                    maxWidth: 595
                });

                // Horizontal line
                page.drawLine({
                    start: { x: 10, y: 842 - 42 },
                    end: { x: 585, y: 842 - 42 },
                    thickness: 1.5,
                    color: rgb(0, 0, 0)
                });

                // === TWO LARGE HEADER BOXES (for maps) ===
                const boxWidth = 282;
                const boxHeight = 180;
                const boxY = 842 - 42 - boxHeight - 10;

                // Left box
                page.drawRectangle({
                    x: 10,
                    y: boxY,
                    width: boxWidth,
                    height: boxHeight,
                    borderWidth: 1,
                    borderColor: rgb(0, 0, 0)
                });
                page.drawText("Transport Coverage", {
                    x: 15,
                    y: boxY + 160,
                    size: 9,
                    font: boldFont,
                    color: rgb(0, 0, 0)
                });
                page.drawText(`Within ${radius}m`, {
                    x: 15,
                    y: boxY + 145,
                    size: 8,
                    font: font,
                    color: rgb(0.3, 0.3, 0.3)
                });

                // Right box
                page.drawRectangle({
                    x: 303,
                    y: boxY,
                    width: boxWidth,
                    height: boxHeight,
                    borderWidth: 1,
                    borderColor: rgb(0, 0, 0)
                });
                page.drawText("Your Closest Stop", {
                    x: 308,
                    y: boxY + 160,
                    size: 9,
                    font: boldFont,
                    color: rgb(0, 0, 0)
                });
                page.drawText("Location For Each Route", {
                    x: 308,
                    y: boxY + 145,
                    size: 8,
                    font: font,
                    color: rgb(0.3, 0.3, 0.3)
                });

                // === TWO-COLUMN ROUTE GRID ===
                const maxItems = Math.min(routes.length, 6);
                const startY = boxY - 20;
                const colWidth = 287.5;
                const rowHeight = 75;

                for (let i = 0; i < maxItems; i++) {
                    const route = routes[i];
                    const routeType = route.type ?? 2;
                    const routeShortName = route.number || 'N/A';

                    // Calculate column and row
                    const col = i % 2;
                    const row = Math.floor(i / 2);
                    const x_off = 10 + col * colWidth;
                    const y_off = startY - row * rowHeight;

                    // Color based on type
                    let rColor = ptvColor(255, 130, 0);
                    let modeLetter = 'B';
                    if (routeType === 0) {
                        rColor = ptvColor(0, 80, 133);
                        modeLetter = 'T';
                    } else if (routeType === 1) {
                        rColor = ptvColor(0, 150, 57);
                        modeLetter = 'M';
                    } else if (routeType === 3) {
                        rColor = ptvColor(116, 0, 184);
                        modeLetter = 'V';
                    }

                    // REMOVE: No more orange circles
                    // Route number badge only (small box)
                    page.drawRectangle({
                        x: x_off + 8,
                        y: y_off - 17,
                        width: 22,
                        height: 12,
                        color: rColor
                    });
                    page.drawText(routeShortName, {
                        x: x_off + 10,
                        y: y_off - 15,
                        size: 8,
                        font: boldFont,
                        color: rgb(1, 1, 1)
                    });

                    // Route name (color-matched)
                    let routeLongName = route.name || '';
                    let viaDisplay = '';
                    const viaMatch = routeLongName.match(/\bvia\s+(.+)$/i);
                    if (viaMatch) {
                        const beforeVia = routeLongName.slice(0, viaMatch.index).trim();
                        const viaPart = viaMatch[1].replace(/\s+/g, ' ').trim();
                        routeLongName = beforeVia;
                        viaDisplay = viaPart;
                    }
                    if (routeLongName.length > 40) {
                        routeLongName = routeLongName.slice(0, 37) + '...';
                    }

                    page.drawText(routeLongName, {
                        x: x_off + 35,
                        y: y_off - 6,
                        size: 8,
                        font: boldFont,
                        color: rColor,
                        maxWidth: colWidth - 50
                    });

                    // Info lines with text labels instead of emojis
                    const stopDistance = Math.round(route.distance_metres ?? 0);
                    
                    page.drawText(`Departs from: ${route.stop_name || 'N/A'} (${stopDistance}m)`, {
                        x: x_off + 8,
                        y: y_off - 22,
                        size: 6.5,
                        font: font,
                        color: rgb(0.2, 0.2, 0.2),
                        maxWidth: colWidth - 15
                    });

                    let viaText = viaDisplay || '(Local coverage area)';
                    if (viaText.length > 50) viaText = viaText.substring(0, 47) + '...';
                    
                    page.drawText(`Via: ${viaText}`, {
                        x: x_off + 8,
                        y: y_off - 32,
                        size: 6.5,
                        font: font,
                        color: rgb(0.3, 0.3, 0.3),
                        maxWidth: colWidth - 15
                    });

                    page.drawText(`Frequency: ${getFreqLabel(frequencyData, routeShortName)}`, {
                        x: x_off + 8,
                        y: y_off - 41,
                        size: 6.5,
                        font: font,
                        color: rgb(0.3, 0.3, 0.3),
                        maxWidth: colWidth - 15
                    });

                    page.drawText(`Span: ${getSpanLabel(frequencyData, routeShortName)}`, {
                        x: x_off + 8,
                        y: y_off - 50,
                        size: 6.5,
                        font: font,
                        color: rgb(0.3, 0.3, 0.3),
                        maxWidth: colWidth - 15
                    });
                }

                // === FOOTER ===
                const footerY = 35;
                page.drawLine({
                    start: { x: 10, y: footerY + 8 },
                    end: { x: 585, y: footerY + 8 },
                    thickness: 0.75,
                    color: rgb(0, 0, 0)
                });

                page.drawText("Note: Stop Distances may be approximated, frequencies may vary across a route, and span may be understated.", {
                    x: 10,
                    y: footerY - 2,
                    size: 6.5,
                    font: font,
                    color: rgb(0.3, 0.3, 0.3),
                    maxWidth: 575
                });
                page.drawText("For up to date information on departure times, myki fares, and disruptions visit transport.vic.gov.au", {
                    x: 10,
                    y: footerY - 9,
                    size: 6.5,
                    font: font,
                    color: rgb(0.3, 0.3, 0.3),
                    maxWidth: 575
                });

                // Save and download
                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: "application/pdf" });
                const link = document.createElement('a');
                link.href = window.URL.createObjectURL(blob);
                link.download = `Transit_Stops_Report_${lat.toFixed(4)}_${lon.toFixed(4)}.pdf`;
                link.click();

                statusDiv.innerText = "Success! Professional PDF Report Generated.";
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "Error building PDF: " + error.message;
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
