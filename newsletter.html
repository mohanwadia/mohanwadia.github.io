    <style>
        body.newsletter-page {
            min-height: 100vh;
            background: #141414;
            color: #eff0f0;
            font-family: "Inter", sans-serif;
        }

        .newsletter-main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 11rem 2.4rem 5rem;
            background:
                radial-gradient(circle at 82% 18%, rgba(17, 171, 176, 0.12), transparent 24rem),
                radial-gradient(circle at 12% 82%, rgba(240, 96, 0, 0.08), transparent 25rem),
                #141414;
        }

        .newsletter-card {
            width: 100%;
            max-width: 1080px;
            min-height: 620px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(320px, 0.72fr);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 8px;
            background: #1e1e1e;
            box-shadow: 0 28px 70px rgba(0, 0, 0, 0.32);
        }

        .newsletter-copy {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: clamp(4rem, 7vw, 8rem);
            border-right: 1px solid rgba(255, 255, 255, 0.07);
        }

        .newsletter-eyebrow {
            margin-bottom: 2.4rem;
            color: #11abb0;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .newsletter-copy h1 {
            max-width: 720px;
            margin: 0 0 2.4rem;
            color: #ffffff;
            font-family: "IBM Plex Serif", serif;
            font-size: clamp(4.8rem, 7vw, 8.4rem);
            font-weight: 600;
            line-height: 0.98;
        }

        .newsletter-copy p {
            max-width: 560px;
            margin: 0;
            color: #c1c1c1;
            font-family: "Inter", sans-serif;
            font-size: clamp(1.7rem, 2vw, 2.1rem);
            line-height: 1.6;
        }

        .newsletter-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: clamp(3.2rem, 5vw, 6rem);
            background: #282828;
        }

        .newsletter-panel h2 {
            margin: 0 0 1.2rem;
            color: #ffffff;
            font-family: "Inter", sans-serif;
            font-size: clamp(2.8rem, 4vw, 4.2rem);
            line-height: 1.1;
        }

        .newsletter-panel .formkit-subheader {
            margin: 0 0 3.2rem;
            color: #b1b2b2;
            font-size: 1.6rem;
            line-height: 1.55;
        }

        .newsletter-page .formkit-form {
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 0;
            border: 0;
            background: transparent;
            color: #eff0f0;
            font-family: "Inter", sans-serif;
        }

        .newsletter-page .formkit-background,
        .newsletter-page .formkit-header,
        .newsletter-page .formkit-guarantee,
        .newsletter-page .formkit-powered-by,
        .newsletter-page .formkit-powered-by-container {
            display: none !important;
        }

        .newsletter-page .formkit-fields {
            display: flex;
            flex-direction: column;
            margin: 0;
            width: 100%;
        }

        .newsletter-page .formkit-field,
        .newsletter-page .formkit-submit {
            width: 100%;
            flex: none;
            margin: 0 0 1.4rem;
        }

        .newsletter-page input.formkit-input {
            width: 100%;
            height: 5.6rem;
            margin: 0;
            border: 1px solid #4f5151;
            border-radius: 5px;
            background: #eff0f0;
            color: #0a0a0a;
            font-family: "Inter", sans-serif;
            font-size: 1.6rem;
            padding: 0 1.6rem;
        }

        .newsletter-page input.formkit-input:focus {
            outline: none;
            border-color: #11abb0;
            box-shadow: 0 0 0 3px rgba(17, 171, 176, 0.16);
        }

        .newsletter-page .formkit-submit {
            height: 5.6rem;
            border: 0;
            border-radius: 5px;
            background: #11abb0;
            color: #ffffff;
            font-family: "Inter", sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .newsletter-page .formkit-submit:hover,
        .newsletter-page .formkit-submit:focus {
            background: #f06000;
            transform: translateY(-1px);
        }

        .newsletter-page .formkit-submit > span {
            padding: 0;
        }

        .newsletter-page .formkit-alert {
            width: 100%;
            margin: 1.2rem 0 0;
            border-radius: 5px;
        }

        @media screen and (max-width: 800px) {
            .newsletter-main {
                align-items: flex-start;
                padding: 9.6rem 1.6rem 3.2rem;
            }

            .newsletter-card {
                min-height: 0;
                grid-template-columns: 1fr;
            }

            .newsletter-copy {
                padding: 5.6rem 3.2rem 4.8rem;
                border-right: 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            }

            .newsletter-copy h1 {
                font-size: clamp(4.6rem, 13vw, 7rem);
            }

            .newsletter-panel {
                padding: 4.8rem 3.2rem;
            }
        }

        @media screen and (max-width: 400px) {
            .newsletter-copy,
            .newsletter-panel {
                padding-left: 2.4rem;
                padding-right: 2.4rem;
            }
        }
    </style>
</head>
