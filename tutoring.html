<!DOCTYPE html>
<html>

<head>
    <title>Student Resource Portal</title>
    <style>
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #000000;
            color: white;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            padding: 20px;
            font-size: 1.2rem;
            border-bottom: 1px solid #34495e;
        }

        /* Scrollable area for your 20 links */
        .link-container {
            flex-grow: 1;
            overflow-y: auto;
        }

        .nav-item {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid #34495e;
            transition: 0.2s;
        }

        .nav-item:hover {
            background: #34495e;
        }

        .nav-item.active {
            background: #3498db;
            border-left: 5px solid #fff;
        }

        /* The Main Viewer */
        .viewer {
            flex-grow: 1;
            position: relative;
            background: #eee;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Invisible Shield to block selection but allow scroll */
        .shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>

<body oncontextmenu="return false;">

    <div class="sidebar">
        <h2>VCE Software Development 3&4</h2>
        <div class="link-container" id="sidebar-links">
        </div>
        <a href="/" style="padding: 20px; color: #bdc3c7; text-decoration: none;">← Back to mohanwadia.com</a>
    </div>

    <div class="viewer">
        <div class="shield"></div>
        <iframe id="main-frame" src=""></iframe>
    </div>

    <script>
        // 1. List all 20 of your Google Docs here
        const resources = [
            { name: "Study Design", id: "https://docs.google.com/document/d/1L5-2OdO_S_pARluJRRGfAcve8o_gFTZaHkkUz0YaCeM/edit?tab=t.0" },
            { name: "Notes + Practice Questions", id: "https://docs.google.com/presentation/d/1JwYaZbHxpzzbb4SJPoOP1stzht1H3Z64smgDsaVljKE/edit?slide=id.p#slide=id.p" }
            // ... Add all 20 here
        ];

        const linkContainer = document.getElementById('sidebar-links');
        const frame = document.getElementById('main-frame');

        // 2. Generate the sidebar buttons
        resources.forEach((doc, index) => {
            const div = document.createElement('div');
            div.className = 'nav-item';
            div.innerText = doc.name;
            div.onclick = () => loadDoc(doc.id, div);
            linkContainer.appendChild(div);

            // Load the first one by default
            if (index === 0) loadDoc(doc.id, div);
        });

        function loadDoc(id, element) {
            // Update the iframe
            // rm=minimal strips Google UI; #toolbar=0 is a backup lock
            frame.src = id.split('?')[0] + '?rm=minimal';

            // Highlight the active link
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        // 3. Security: Block Copy/Print shortcuts
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && ['c', 'p', 's', 'u'].includes(e.key.toLowerCase())) {
                e.preventDefault();
                alert("This content is protected.");
            }
        });
    </script>
</body>

</html>
