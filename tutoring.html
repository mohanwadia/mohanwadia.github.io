<!DOCTYPE html>
<html>

<head>
    <title>Student Resource Portal</title>
    <style>
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #000000;
            color: white;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            padding: 20px;
            font-size: 1.2rem;
            border-bottom: 3px solid #da772a;
        }

        /* Scrollable area for your 20 links */
        .link-container {
            flex-grow: 1;
            overflow-y: auto;
        }

        .nav-item {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid #34495e;
            transition: 0.2s;
        }

        .nav-item:hover {
            background: #da772a;
        }

        .nav-item.active {
            background: #da772a;
            border-left: 5px solid #fff;
        }

        /* The Main Viewer */
        .viewer {
            flex-grow: 1;
            position: relative;
            background: #eee;
            overflow: hidden;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.92);
            z-index: 10;
            font-family: sans-serif;
            color: #333;
            font-size: 1rem;
            transition: opacity 0.2s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Invisible Shield to block selection but allow scroll */
        .shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>

<body oncontextmenu="return false;">

    <div class="sidebar">
        <h2>VCE Software Development 3&4</h2>
        <div class="link-container" id="sidebar-links">
        </div>
        <a href="/" style="padding: 20px; color: #bdc3c7; text-decoration: none;">← Back to mohanwadia.com</a>
    </div>

    <div class="viewer">
        <div class="shield"></div>
        <div id="loading-overlay" class="loading-overlay">Loading document…</div>
        <iframe id="main-frame" src=""></iframe>
    </div>

    <script>
        
        const resources = [
            { name: "Study Design", id: "https://docs.google.com/document/d/1L5-2OdO_S_pARluJRRGfAcve8o_gFTZaHkkUz0YaCeM/edit?tab=t.0" },
            { name: "3.1 Slides", id: "https://docs.google.com/presentation/d/1JwYaZbHxpzzbb4SJPoOP1stzht1H3Z64smgDsaVljKE/edit?slide=id.p#slide=id.p" },
            { name: "3.1 Exam", id: "https://1drv.ms/w/c/DEC5E1D01CFCD424/IQRBZkRpukEfSJ6HEhbArbCwAa9sZfXzwemqL8RFKdC-5pA?em=2&amp;wdEmbedCode=0" },
            { name: "3.2 Slides", id: "https://docs.google.com/presentation/d/1n_pWDVcKPEPCFfzkTMg0sIOogdqLL4GoVHCOursDyro/edit?usp=sharing" },
            { name: "Exam Notes (Old SD)", id: "https://docs.google.com/document/d/1k06JwlaaV-IGhBbCLNQ2GCqKxqSiWXKf_k59H3ZhSRs/edit?tab=t.0#heading=h.dk966y25cpzj" },
            { name: "Full Content Notes (Old SD)", id: "https://docs.google.com/document/d/1me0kB_5sHv7ONWPddHmFeVf95LlsIiCENS29qhLm5I0/edit?tab=t.0#heading=h.t9azwdxprupl" },
            {name: "4.1 Slides", id:"https://docs.google.com/presentation/d/1kl5sRQUOg8IHQZmDi-jSUVfUuJt3whLOUBMVqN83IpE/edit?slide=id.g3e16e27c93b_0_63#slide=id.g3e16e27c93b_0_63"}
            
        ];

        const linkContainer = document.getElementById('sidebar-links');
        const frame = document.getElementById('main-frame');
        const loadingOverlay = document.getElementById('loading-overlay');

        frame.onload = () => {
            loadingOverlay.classList.add('hidden');
        };

        // 2. Generate the sidebar buttons
        resources.forEach((doc, index) => {
            const div = document.createElement('div');
            div.className = 'nav-item';
            div.innerText = doc.name;
            div.onclick = () => loadDoc(doc.id, div);
            linkContainer.appendChild(div);

            // Load the first one by default
            if (index === 0) loadDoc(doc.id, div);
        });

        function loadDoc(id, element) {
            // Show the loading placeholder while external content loads
            loadingOverlay.classList.remove('hidden');

            // Update the iframe
            // rm=minimal strips Google UI; #toolbar=0 is a backup lock
            if (id.includes("docs.google.com")) {
                frame.src = id.split('?')[0] + '?rm=minimal';
            }
            else {
                frame.src = id;
            }

            // Highlight the active link
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        // 3. Security: Block Copy/Print shortcuts
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && ['c', 'p', 's', 'u'].includes(e.key.toLowerCase())) {
                e.preventDefault();
                alert("This content is protected.");
            }
        });
    </script>
</body>

</html>
